[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exif-atlas"
dynamic = ["version"]
description = "A local report about how you actually shoot, built from the EXIF you already have."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Keivan Malhani" }]
keywords = ["exif", "photography", "metadata", "report", "privacy", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/keivanmalhani/exif-atlas"
Source = "https://github.com/keivanmalhani/exif-atlas"
Issues = "https://github.com/keivanmalhani/exif-atlas/issues"

[project.scripts]
exif-atlas = "exif_atlas.cli:main"

[tool.setuptools.dynamic]
version = { attr = "exif_atlas.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
