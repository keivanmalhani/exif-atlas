name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # First on purpose. An editable install leaves __pycache__ and an
      # egg-info directory in the tree, and a grep for non-ASCII bytes run
      # afterwards matches compiled bytecode every time. The exclusions
      # below are belt and braces for anyone who moves this step.
      - name: ASCII only
        run: |
          if LC_ALL=C grep -rnPI '[^\x09\x20-\x7e]' . \
              --exclude-dir=.git \
              --exclude-dir=__pycache__ \
              --exclude-dir='*.egg-info' \
              --exclude-dir=.pytest_cache ; then
            echo "non-ASCII bytes found in the tree"
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: No runtime dependencies
        run: |
          python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              data = tomllib.load(handle)
          deps = data["project"]["dependencies"]
          assert deps == [], "runtime dependencies crept in: %r" % deps
          print("runtime dependencies: none")
          PY

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Entry point works
        run: |
          exif-atlas --version
          python - "$RUNNER_TEMP/photos" <<'PY'
          import sys
          from tests import fixtures as fx
          for index in range(30):
              fx.write(sys.argv[1], "f%02d.jpg" % index,
                       fx.simple_jpeg(focal=[23.0, 35.0, 56.0][index % 3],
                                      gps=(51.507351, -0.127758)))
          print("built 30 fixtures")
          PY
          exif-atlas scan "$RUNNER_TEMP/photos" -o "$RUNNER_TEMP/atlas.html"
          test -s "$RUNNER_TEMP/atlas.html"

      - name: Report is self contained
        run: |
          python - "$RUNNER_TEMP/atlas.html" <<'PY'
          import sys
          html = open(sys.argv[1], encoding="utf-8").read()
          html.encode("ascii")
          for pattern in ("http://", "https://", "<script", "@import"):
              assert pattern not in html, "remote reference: %s" % pattern
          print("self contained: %d bytes" % len(html))
          PY
